user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Nén Gzip tối ưu
    gzip on;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/geo+json;

    client_max_body_size 15M;

    upstream backend_upstream {
        server backend-api:5000;
        keepalive 32;
    }

    # Chuyển hướng HTTP sang HTTPS
    server {
        listen 80;
        server_name _;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # Máy chủ HTTPS an toàn (Cú pháp Nginx 1.25+)
    server {
        listen 443 ssl;
        http2 on;
        server_name _; # Hoặc điền domain của bạn, ví dụ: roaddamage-gis.duckdns.org

        # Đường dẫn chứng chỉ Let's Encrypt (thay YOUR_DOMAIN bằng domain thật của bạn)
        ssl_certificate /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        # 1. Phục vụ Web Admin tĩnh (HTML/JS/CSS)
        location / {
            root /usr/share/nginx/html;
            index index.html index.htm;
            try_files $uri $uri/ /index.html;

            location ~* \.(?:css|js|woff2?|svg|ico)$ {
                expires 30d;
                add_header Cache-Control "public, max-age=2592000, immutable";
            }
        }

        # 2. Phục vụ ảnh báo cáo trực tiếp (Bypass Python, tối ưu tốc độ)
        location /uploads/ {
            alias /var/www/uploads/;
            expires 7d;
            add_header Cache-Control "public, max-age=604800";
            access_log off;
            open_file_cache max=5000 inactive=12h;
            open_file_cache_valid 30m;
            open_file_cache_min_uses 2;
        }

        # 3. Định tuyến REST API sang FastAPI
        location /api/ {
            proxy_pass http://backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 15s;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
            
            proxy_buffering on;
            proxy_buffer_size 128k;
            proxy_buffers 4 256k;
            proxy_busy_buffers_size 256k;
        }

        # 4. Chuyển tiếp kiểm tra sức khỏe hệ thống
        location ~ ^/(health|ready) {
            proxy_pass http://backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}

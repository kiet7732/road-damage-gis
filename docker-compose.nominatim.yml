services:
  nominatim:
    image: mediagis/nominatim:4.4
    container_name: rdg-nominatim
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - PBF_URL=https://download.geofabrik.de/asia/vietnam-latest.osm.pbf
      - REPLICATION_URL=https://download.geofabrik.de/asia/vietnam-updates/
      - NOMINATIM_PASSWORD=rdg_secret
    volumes:
      - nominatim-data:/var/lib/postgresql/16/main
      - nominatim-flatnode:/nominatim/flatnode
    shm_size: 1gb

volumes:
  nominatim-data:
  nominatim-flatnode:

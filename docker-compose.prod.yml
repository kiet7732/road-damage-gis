version: '3.8'

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  # 1. Cơ sở dữ liệu không gian PostGIS (PostgreSQL 16 + PostGIS 3.4)
  postgis:
    image: postgis/postgis:16-3.4
    container_name: rdg-postgis
    restart: always
    logging: *default-logging
    environment:
      POSTGRES_DB: road_damage_gis
      POSTGRES_USER: rdg_admin
      POSTGRES_PASSWORD: rdg_super_secure_password_2026
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgis_data:/var/lib/postgresql/data
      - ./docker/postgis/initdb.d:/docker-entrypoint-initdb.d:ro
    deploy:
      resources:
        limits:
          cpus: '0.80'
          memory: 800M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rdg_admin -d road_damage_gis"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - rdg_network

  # 2. AI Inference Service (YOLO CPU / ONNX - 1 Worker / 2 Threads)
  ai-service:
    build:
      context: ./services/ai-service
      dockerfile: Dockerfile
    container_name: rdg-ai-service
    restart: always
    logging: *default-logging
    command: uvicorn app.main:app --host 0.0.0.0 --port 8001 --workers 1
    environment:
      APP_NAME: "Road Damage AI Service"
      APP_ENV: production
      AI_MODEL_PATH: ./models/best_26s_rdd_vn.pt
      AI_IMAGE_SIZE: 640
      AI_INFERENCE_TIMEOUT_SECONDS: 15
      AI_DEVICE: cpu
      OMP_NUM_THREADS: 2
      MKL_NUM_THREADS: 2
    volumes:
      - ./services/ai-service/models:/app/models
    deploy:
      resources:
        limits:
          cpus: '1.20'
          memory: 1000M
    networks:
      - rdg_network

  # 3. Backend API Core (1 Worker để bảo toàn preview_token trong RAM)
  backend-api:
    build:
      context: ./services/backend-api
      dockerfile: Dockerfile
    container_name: rdg-backend-api
    restart: always
    logging: *default-logging
    command: uvicorn app.main:app --host 0.0.0.0 --port 5000 --workers 1
    env_file:
      - .env.production
    volumes:
      - ./uploads:/app/uploads
    deploy:
      resources:
        limits:
          cpus: '0.80'
          memory: 600M
    depends_on:
      postgis:
        condition: service_healthy
      ai-service:
        condition: service_started
    networks:
      - rdg_network

  # 4. Nginx Reverse Proxy & Static File Engine
  nginx:
    image: nginx:alpine
    container_name: rdg-nginx
    restart: always
    logging: *default-logging
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./apps/web-admin/dist:/usr/share/nginx/html:ro
      - ./uploads:/var/www/uploads:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    deploy:
      resources:
        limits:
          cpus: '0.20'
          memory: 150M
    depends_on:
      - backend-api
    networks:
      - rdg_network

volumes:
  postgis_data:
    name: rdg_postgis_data

networks:
  rdg_network:
    driver: bridge
